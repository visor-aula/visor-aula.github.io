<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Libro</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --marco: #ece8e2; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--marco); }
  body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  #contenedor { position: fixed; inset: 0; touch-action: none; }
  ruffle-player { display: block; width: 100%; height: 100%; }

  #carga {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: var(--marco);
    font: 500 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: rgba(0,0,0,.62);
    transition: opacity .45s ease;
  }
  #carga.oculto { opacity: 0; pointer-events: none; }
  #portada {
    height: min(58vh, 520px); aspect-ratio: 1100 / 1430; object-fit: cover;
    border-radius: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.18);
    background: rgba(255,255,255,.4);
  }
  #portada[hidden] { display: none; }
  .barra { width: 160px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.12); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 34%; border-radius: 2px; background: rgba(0,0,0,.55); animation: ir 1.15s ease-in-out infinite; }
  @keyframes ir { from { transform: translateX(-110%); } to { transform: translateX(310%); } }

  #error {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: var(--marco); font: 16px/1.45 system-ui, -apple-system, Roboto, sans-serif; color: #222; text-align: center;
  }
  #error.visible { display: flex; }

  /* Video en MP4 encima de la ventana de video del libro */
  #videoHTML { position: fixed; z-index: 6; background: #000; overflow: hidden; touch-action: manipulation; }
  #videoHTML video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #videoHTML video::cue { background: rgba(0,0,0,.5); color: #fff; }
  #videoHTML .subtitulo {
    position: absolute; left: 6%; right: 6%; bottom: 17%; text-align: center; pointer-events: none;
    font: 600 clamp(13px, 3.4vmin, 30px)/1.3 system-ui, Roboto, sans-serif; color: #fff;
    text-shadow: 0 0 4px #000, 0 1px 3px #000, 0 0 1px #000;
  }
  #videoHTML .subtitulo span { background: rgba(0,0,0,.45); padding: .08em .35em; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  /* Botón de subtítulos: pequeño, y solo aparece junto con los controles del video */
  #videoHTML button.sub {
    position: absolute; top: 6px; right: 6px; height: 24px; min-width: 34px; padding: 0 7px; border-radius: 5px;
    border: 1.5px solid rgba(255,255,255,.75); background: rgba(0,0,0,.28); color: rgba(255,255,255,.92);
    font: 800 11px/1 system-ui, Roboto, sans-serif; letter-spacing: .05em;
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  #videoHTML button.sub::before { content: ""; position: absolute; inset: -10px; } /* área de toque más grande */
  #videoHTML.controles button.sub { opacity: 1; pointer-events: auto; }
  #videoHTML button.sub.activo { background: rgba(255,255,255,.9); color: #111; border-color: transparent; }
  /* Menú de subtítulos: apagados o en cuatro tamaños */
  .menuSub {
    position: fixed; z-index: 7; top: 0; right: 0; display: none; flex-direction: column; min-width: 150px; padding: 6px;
    border-radius: 10px; background: rgba(18,18,18,.9); box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .menuSub.visible { display: flex; }
  .menuSub .titulo { padding: 4px 10px 6px; color: rgba(255,255,255,.6); font: 700 11px system-ui, Roboto, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  .menuSub button {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 0; border-radius: 6px;
    background: transparent; color: #fff; text-align: left; font: 500 15px system-ui, Roboto, sans-serif;
  }
  .menuSub button::before { content: ""; width: 16px; text-align: center; font-weight: 800; }
  .menuSub button[aria-checked="true"] { background: rgba(255,255,255,.14); }
  .menuSub button[aria-checked="true"]::before { content: "✓"; }
  .avisoBasico {
    position: fixed; z-index: 8; left: 50%; top: 10px; transform: translateX(-50%); max-width: min(90vw, 560px);
    padding: 8px 14px; border-radius: 999px; background: rgba(20,20,20,.82); color: #fff; text-align: center;
    font: 500 13px/1.35 system-ui, Roboto, sans-serif; pointer-events: none; transition: opacity .8s ease;
  }
  .avisoBasico.fuera { opacity: 0; }
  #error div { max-width: 460px; }
  #error button {
    margin-top: 18px; font: 600 15px system-ui, Roboto, sans-serif; padding: 12px 22px; border-radius: 999px;
    border: 0; background: #1f1d1a; color: #fff;
  }
</style>
</head>
<body>
<div id="contenedor"></div>
<div id="carga">
  <img id="portada" alt="" hidden>
  <div class="barra"><i></i></div>
  <div id="titulo"></div>
</div>
<div id="error"><div><strong>No se pudo abrir el libro.</strong><p id="detalle"></p><button type="button" id="volver">Volver a la biblioteca</button></div></div>

<!-- Versión web: lo que en Android hacen MainActivity y Servidor (en Android estos archivos no existen y no pasa nada) -->
<script src="js/zip.js"></script>
<script src="js/parches-datos.js"></script>
<script src="js/parches.js"></script>
<script src="js/puente-web.js"></script>
<script>
  "use strict";
  var datos = {};
  try { datos = JSON.parse(Android.datosLibro()) || {}; } catch (e) { }

  if (datos.color) document.documentElement.style.setProperty("--marco", datos.color);
  document.title = datos.titulo || "Libro";
  document.getElementById("titulo").textContent = datos.precarga ? "Preparando el libro…" : (datos.titulo ? "Abriendo " + datos.titulo + "…" : "Abriendo…");
  if (datos.portada) {
    var img = document.getElementById("portada");
    img.onload = function () { img.hidden = false; };
    img.src = datos.portada;
  }

  // El primer libro que se abre desde que arrancó la app se abre primero de forma oculta (tras la
  // portada y sin sonido) y luego otra vez para la maestra: la primera apertura salía con el texto
  // mal y sin responder a los toques; la segunda siempre funcionaba bien.
  var precarga = !!datos.precarga;

  // Debe empezar con "http:": el reproductor de video del libro solo reproduce si es así.
  // En la web, js/puente-web.js da http://<id>.libro.local/ y responde esas direcciones desde el zip.
  var BASE = window.LIBRO_BASE || (location.origin + "/");

  function salir() {
    try { if (window.__liberar) window.__liberar(); } catch (e) { }
    try { Android.cerrarLibro(); } catch (e) { }
  }

  // Funciones que el libro llama con javascript: (en el original las define recursos/config_flash.js)
  // Botón de ventana del libro (arriba a la derecha): en la web pone o quita la pantalla completa
  window.maximizarApp = function () { try { if (Android.pantallaCompleta) Android.pantallaCompleta(true); } catch (e) { } };
  window.restaurarApp = function () { try { if (Android.pantallaCompleta) Android.pantallaCompleta(false); } catch (e) { } };
  window.cerrarVentana = salir;
  window.close = salir;

  // Ventanas nuevas: los enlaces de internet se abren en el navegador; lo demás se ignora
  window.open = function (url) {
    var u;
    try { u = new URL(String(url), BASE); } catch (e) { return null; }
    if (/\.libro\.local$/i.test(u.hostname)) { console.warn("[libro] ventana nueva ignorada:", u.href); return null; }
    if (/^https?:$/.test(u.protocol)) { try { Android.abrirExterno(u.href); } catch (e) { } }
    return null;
  };

  // "Exportar sesión": Ruffle descarga el archivo con un enlace temporal (blob) que la vista
  // web de Android no sabe guardar. Se lee aquí y se le pasa a la app para guardarlo.
  (function () {
    var pendientes = {};
    var revocar = URL.revokeObjectURL.bind(URL);
    URL.revokeObjectURL = function (u) {
      if (pendientes[u]) { setTimeout(function () { revocar(u); }, 60000); return; }
      revocar(u);
    };
    var clicOriginal = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      var href = String(this.href || "");
      var nombre = this.getAttribute("download");
      if (nombre !== null && href.indexOf("blob:") === 0) {
        pendientes[href] = true;
        fetch(href).then(function (r) { return r.blob(); }).then(function (blob) {
          var lector = new FileReader();
          lector.onload = function () {
            var datos = String(lector.result || "");
            var coma = datos.indexOf(",");
            try { Android.guardarArchivo(nombre || "sesion", blob.type || "application/octet-stream", datos.slice(coma + 1)); } catch (e) { }
          };
          lector.readAsDataURL(blob);
        });
        return;
      }
      return clicOriginal.apply(this, arguments);
    };
  })();

  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    publicPath: "ruffle/",   // relativa: /__app/ruffle/ en Android, junto a visor.html en la web
    polyfills: false,
    autoplay: "on",
    unmuteOverlay: "hidden",
    splashScreen: false,
    letterbox: "off",
    backgroundColor: datos.color || null,
    contextMenu: "off",
    showSwfDownload: false,
    allowScriptAccess: true,
    // Sin esto, Ruffle usa calidad "baja" en celulares y tabletas (sin suavizado: texto y botones
    // se ven pixeleados) hasta que alguna parte del libro pide "BEST". Se usa desde el inicio.
    quality: "best",
    openUrlMode: "allow",
    allowNetworking: "all",
    warnOnUnsupportedContent: false,
    upgradeToHttps: false,
    logLevel: "warn",
    base: BASE
  };

  // ---------- Videos en MP4 ----------
  // La rutina que la app agrega a VIDEO.swf llama a estas funciones. Si el libro trae el video
  // en MP4, se reproduce con el reproductor del sistema (decodificado por hardware, con el audio
  // sincronizado) justo encima del reproductor Flash, que se queda detenido debajo.
  var video = null;

  function existeArchivo(ruta) {
    try { if (window.Android && Android.existe) return !!Android.existe(ruta); } catch (e) { }
    try {
      var x = new XMLHttpRequest();
      x.open("GET", BASE + ruta, false);
      x.setRequestHeader("Range", "bytes=0-0");
      x.send();
      return x.status === 200 || x.status === 206;
    } catch (e) { return false; }
  }

  function tamEscenario() {
    var w = 1024, h = 768;
    try {
      var md = window.__ruffle && window.__ruffle.metadata;
      if (md && md.width > 0 && md.height > 0) { w = md.width; h = md.height; }
    } catch (e) { }
    return { w: w, h: h };
  }

  function colocarVideo() {
    if (!video || !video.rect) return;
    var e = tamEscenario(), r = video.rect;
    var W = window.innerWidth, H = window.innerHeight;
    var s = Math.min(W / e.w, H / e.h), ox = (W - e.w * s) / 2, oy = (H - e.h * s) / 2;
    var x0 = Math.max(0, r[0]), y0 = Math.max(0, r[1]), x1 = Math.min(e.w, r[2]), y1 = Math.min(e.h, r[3]);
    if (x1 <= x0 || y1 <= y0) return;
    var st = video.div.style;
    st.left = Math.round(ox + x0 * s) + "px";
    st.top = Math.round(oy + y0 * s) + "px";
    st.width = Math.round((x1 - x0) * s) + "px";
    st.height = Math.round((y1 - y0) * s) + "px";
    aplicarTamanoSubtitulos();
    if (video.menu && video.menu.classList.contains("visible")) colocarMenu();
  }
  window.addEventListener("resize", colocarVideo);

  function leerSubtitulos(ruta, listo) {
    fetch(BASE + ruta).then(function (r) { return r.ok ? r.text() : ""; }).then(function (txt) {
      var lista = [];
      if (txt) {
        var doc = new DOMParser().parseFromString(txt, "text/xml");
        var subs = doc.getElementsByTagName("subtitulo");
        for (var i = 0; i < subs.length; i++) {
          var ini = subs[i].getElementsByTagName("tiempoIni")[0], fin = subs[i].getElementsByTagName("tiempoFin")[0];
          var tx = subs[i].getElementsByTagName("texto")[0];
          if (!ini || !fin || !tx) continue;
          lista.push({ ini: parseFloat(ini.textContent), fin: parseFloat(fin.textContent), texto: tx.textContent.split("*") });
        }
      }
      listo(lista);
    }).catch(function () { listo([]); });
  }

  // Tamaños de subtítulos (alto de la letra en proporción al alto del video). La elección se
  // guarda en la app y vale para todos los libros.
  var TAMANOS_SUB = [
    { id: "no", nombre: "Sin subtítulos" },
    { id: "chico", nombre: "Chicos", f: 0.052 },
    { id: "mediano", nombre: "Medianos", f: 0.068 },
    { id: "grande", nombre: "Grandes", f: 0.088 },
    { id: "enorme", nombre: "Muy grandes", f: 0.11 }
  ];
  function tamanoSubtitulos() {
    var v = null;
    try { if (window.Android && Android.leerAjuste) v = Android.leerAjuste("subtitulos"); } catch (e) { }
    if (!v) { try { v = localStorage.getItem("subtitulos"); } catch (e) { } }
    if (v === "si") v = "mediano"; // versión anterior: solo encendidos o apagados
    for (var i = 0; i < TAMANOS_SUB.length; i++) if (TAMANOS_SUB[i].id === v) return v;
    return "mediano";
  }
  function guardarTamanoSubtitulos(v) {
    try { if (window.Android && Android.guardarAjuste) Android.guardarAjuste("subtitulos", v); } catch (e) { }
    try { localStorage.setItem("subtitulos", v); } catch (e) { }
  }
  function colocarMenu() {
    if (!video) return;
    var r = video.div.getBoundingClientRect(), m = video.menu;
    m.style.right = Math.max(6, Math.round(window.innerWidth - r.right + 6)) + "px";
    m.style.top = Math.max(6, Math.min(Math.round(r.top + 36), window.innerHeight - m.offsetHeight - 6)) + "px";
  }
  function aplicarTamanoSubtitulos() {
    if (!video) return;
    var t = null;
    for (var i = 0; i < TAMANOS_SUB.length; i++) if (TAMANOS_SUB[i].id === video.tamano) t = TAMANOS_SUB[i];
    var alto = video.div.getBoundingClientRect().height || 300;
    if (t && t.f) video.sub.style.fontSize = Math.max(12, Math.round(alto * t.f)) + "px";
  }

  window.abrirVideoHTML = function (ruta, x0, y0, x1, y1) {
    try {
      var rel = String(ruta || "").replace(/\\/g, "/").replace(/^\/+/, "").split("?")[0];
      if (!/\.flv$/i.test(rel)) return false;
      var mp4 = rel.replace(/\.flv$/i, ".mp4");
      if (!existeArchivo(mp4)) return false;
      cerrarVideoHTML();

      var div = document.createElement("div");
      div.id = "videoHTML";
      var v = document.createElement("video");
      v.setAttribute("playsinline", "");
      v.setAttribute("controls", "");
      v.setAttribute("controlsList", "nofullscreen nodownload noplaybackrate noremoteplayback");
      v.setAttribute("disablePictureInPicture", "");
      v.preload = "auto";
      if (window.urlArchivo) {
        // Web: el MP4 sale directo del zip con una dirección blob: (sin servidor)
        window.urlArchivo(mp4).then(function (u) {
          if (!video || video.v !== v) return;
          v.src = u;
          var pp = v.play();
          if (pp && pp.catch) pp.catch(function () { div.classList.add("controles"); });
        }, function (err) { console.warn("[libro] video", err); });
      } else {
        v.src = BASE + mp4;
      }
      var sub = document.createElement("div");
      sub.className = "subtitulo";
      var boton = document.createElement("button");
      boton.type = "button";
      boton.className = "sub";
      boton.textContent = "CC";
      boton.setAttribute("aria-label", "Subtítulos");
      var menu = document.createElement("div");
      menu.className = "menuSub";
      menu.setAttribute("role", "menu");
      var titulo = document.createElement("div");
      titulo.className = "titulo";
      titulo.textContent = "Subtítulos";
      menu.appendChild(titulo);
      div.appendChild(v); div.appendChild(sub); div.appendChild(boton);
      document.body.appendChild(div);
      document.body.appendChild(menu); // fuera del video para que quepa aunque el video sea chico

      var tam = tamanoSubtitulos();
      video = { div: div, v: v, sub: sub, cues: [], tamano: tam, activos: tam !== "no", rect: [x0, y0, x1, y1], ultimo: null, ocultar: 0, cerrarMenu: 0, menu: menu };
      var esto = video;
      boton.classList.toggle("activo", esto.activos);
      var opciones = TAMANOS_SUB.map(function (t) {
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("role", "menuitemradio");
        b.textContent = t.nombre;
        b.addEventListener("click", function (e) {
          e.stopPropagation();
          esto.tamano = t.id;
          esto.activos = t.id !== "no";
          guardarTamanoSubtitulos(t.id);
          marcarOpciones();
          boton.classList.toggle("activo", esto.activos);
          aplicarTamanoSubtitulos();
          esto.ultimo = undefined;
          pintar();
          if (esto.actualizarPista) esto.actualizarPista();
          clearTimeout(esto.cerrarMenu);
          esto.cerrarMenu = setTimeout(function () { menu.classList.remove("visible"); }, 600);
        });
        menu.appendChild(b);
        return { b: b, id: t.id };
      });
      function marcarOpciones() {
        opciones.forEach(function (o) { o.b.setAttribute("aria-checked", o.id === esto.tamano ? "true" : "false"); });
      }
      marcarOpciones();

      // El botón se ve mientras el video está en pausa y unos segundos después de tocar el video,
      // igual que los controles del reproductor; mientras se reproduce, se esconde solo.
      function mostrarControles() {
        div.classList.add("controles");
        clearTimeout(esto.ocultar);
        esto.ocultar = setTimeout(function () { if (!v.paused) div.classList.remove("controles"); }, 3000);
      }
      div.addEventListener("pointerdown", mostrarControles, true);
      v.addEventListener("pause", function () { clearTimeout(esto.ocultar); div.classList.add("controles"); });
      v.addEventListener("play", mostrarControles);
      v.addEventListener("seeking", mostrarControles);
      function pintar() {
        var t = v.currentTime, actual = null;
        if (esto.activos) for (var i = 0; i < esto.cues.length; i++) {
          if (t >= esto.cues[i].ini && t <= esto.cues[i].fin) { actual = esto.cues[i]; break; }
        }
        if (actual === esto.ultimo) return;
        esto.ultimo = actual;
        sub.innerHTML = "";
        if (actual) actual.texto.forEach(function (linea, i) {
          if (i) sub.appendChild(document.createElement("br"));
          var s = document.createElement("span"); s.textContent = linea; sub.appendChild(s);
        });
      }
      v.addEventListener("timeupdate", pintar);
      v.addEventListener("seeked", pintar);
      // CC abre el menú; se cierra al elegir, al tocar otra parte del video o a los 8 segundos
      boton.addEventListener("click", function (e) {
        e.stopPropagation();
        mostrarControles();
        var abrir = !menu.classList.contains("visible");
        menu.classList.toggle("visible", abrir);
        if (abrir) colocarMenu();
        clearTimeout(esto.cerrarMenu);
        if (abrir) esto.cerrarMenu = setTimeout(function () { menu.classList.remove("visible"); }, 8000);
      });
      menu.addEventListener("pointerdown", function (e) { e.stopPropagation(); clearTimeout(esto.cerrarMenu); });
      v.addEventListener("pointerdown", function () { menu.classList.remove("visible"); });
      // Pantalla completa del reproductor (Safari, iPad, iPhone): ahí no se ve la capa de subtítulos de
      // arriba, solo las pistas del propio video. Se agrega una pista con los mismos subtítulos que solo
      // se muestra en pantalla completa (fuera de ella se usa la capa, con el tamaño elegido en CC).
      function enPantallaCompleta() {
        return !!(v.webkitDisplayingFullscreen || v.webkitPresentationMode === "fullscreen" ||
          document.fullscreenElement === v || document.webkitFullscreenElement === v);
      }
      function actualizarPista() {
        if (!esto.pista) return;
        var modo = esto.activos && enPantallaCompleta() ? "showing" : "hidden";
        if (esto.pista.mode !== modo) esto.pista.mode = modo;
      }
      esto.actualizarPista = actualizarPista;
      ["webkitbeginfullscreen", "webkitendfullscreen", "webkitpresentationmodechanged"].forEach(function (ev) {
        v.addEventListener(ev, function () { setTimeout(actualizarPista, 0); });
      });
      esto.alCambiarPantalla = function () { setTimeout(actualizarPista, 0); };
      document.addEventListener("fullscreenchange", esto.alCambiarPantalla);
      document.addEventListener("webkitfullscreenchange", esto.alCambiarPantalla);
      leerSubtitulos(rel.replace(/\.flv$/i, ".xml"), function (lista) {
        esto.cues = lista; pintar();
        try {
          if (!lista.length || !v.addTextTrack || typeof VTTCue !== "function") return;
          var pista = v.addTextTrack("subtitles", "Subtítulos", "en");
          lista.forEach(function (c) {
            if (c.fin > c.ini) pista.addCue(new VTTCue(c.ini, c.fin, c.texto.join("\n").replace(/&/g, "&amp;").replace(/</g, "&lt;")));
          });
          esto.pista = pista;
          actualizarPista();
        } catch (err) { console.warn("[libro] pista de subtítulos", err); }
      });

      colocarVideo();
      aplicarTamanoSubtitulos();
      if (!window.urlArchivo) {
        var p = v.play();
        if (p && p.catch) p.catch(function () { });
      }
      return true;
    } catch (e) {
      console.warn("[libro] no se pudo abrir el video MP4", e);
      return false;
    }
  };

  window.moverVideoHTML = function (x0, y0, x1, y1) {
    if (!video) return;
    var r = video.rect;
    if (r[0] === x0 && r[1] === y0 && r[2] === x1 && r[3] === y1) return;
    video.rect = [x0, y0, x1, y1];
    colocarVideo();
  };

  window.cerrarVideoHTML = function () {
    if (!video) return;
    clearTimeout(video.ocultar);
    var v = video.v;
    if (video.alCambiarPantalla) {
      document.removeEventListener("fullscreenchange", video.alCambiarPantalla);
      document.removeEventListener("webkitfullscreenchange", video.alCambiarPantalla);
    }
    try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) { }
    try { if (window.soltarArchivos) window.soltarArchivos(); } catch (e) { }
    if (video.div.parentNode) video.div.parentNode.removeChild(video.div);
    if (video.menu && video.menu.parentNode) video.menu.parentNode.removeChild(video.menu);
